<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006A67">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Stillpoint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: Material Design 3 phone app — small top app bar, one scrolling destination, bottom navigation bar; immersive dark player. All sizes in rem so the text-size setting scales the whole UI. */
:root{
  --primary:#006A67; --on-primary:#FFFFFF; --primary-container:#9DF2EC; --on-primary-container:#00201F;
  --secondary:#4A6361; --secondary-container:#CCE8E5; --on-secondary-container:#051F1E;
  --tertiary:#4A607C; --tertiary-container:#D2E4FF; --on-tertiary-container:#031C35;
  --error:#BA1A1A; --error-container:#FFDAD6; --on-error-container:#410002;
  --surface:#F4FBF9; --surface-c-low:#EEF5F3; --surface-c:#E8EFED; --surface-c-high:#E3EAE8; --surface-c-highest:#DDE4E2;
  --on-surface:#161D1C; --on-surface-variant:#3F4948; --outline:#6F7978; --outline-variant:#BEC9C7;
  --ok:#1E6B3A; --ok-container:#B7F1C5;
  --font:'Roboto','Noto Sans TC',system-ui,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#80D5D0; --on-primary:#003735; --primary-container:#00504D; --on-primary-container:#9DF2EC;
  --secondary:#B0CCC9; --secondary-container:#324B49; --on-secondary-container:#CCE8E5;
  --tertiary:#B2C8E8; --tertiary-container:#334863; --on-tertiary-container:#D2E4FF;
  --error:#FFB4AB; --error-container:#93000A; --on-error-container:#FFDAD6;
  --surface:#0E1514; --surface-c-low:#161D1C; --surface-c:#1A2120; --surface-c-high:#252B2A; --surface-c-highest:#2F3635;
  --on-surface:#DDE4E2; --on-surface-variant:#BEC9C7; --outline:#889392; --outline-variant:#3F4948;
  --ok:#8FD8A4; --ok-container:#0D5229; color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#80D5D0; --on-primary:#003735; --primary-container:#00504D; --on-primary-container:#9DF2EC;
  --secondary:#B0CCC9; --secondary-container:#324B49; --on-secondary-container:#CCE8E5;
  --tertiary:#B2C8E8; --tertiary-container:#334863; --on-tertiary-container:#D2E4FF;
  --error:#FFB4AB; --error-container:#93000A; --on-error-container:#FFDAD6;
  --surface:#0E1514; --surface-c-low:#161D1C; --surface-c:#1A2120; --surface-c-high:#252B2A; --surface-c-highest:#2F3635;
  --on-surface:#DDE4E2; --on-surface-variant:#BEC9C7; --outline:#889392; --outline-variant:#3F4948;
  --ok:#8FD8A4; --ok-container:#0D5229; color-scheme:dark}

html{font-size:calc(100% * var(--scale))}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
p{margin:0}
.wrap{max-width:40rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* M3 type scale */
.headline{font-size:1.5rem;line-height:2rem;font-weight:400;margin:0;text-wrap:balance}
.title-l{font-size:1.375rem;line-height:1.75rem;font-weight:400;margin:0}
.title-m{font-size:1rem;line-height:1.5rem;font-weight:500;margin:0;letter-spacing:.01em}
.body-m{font-size:.875rem;line-height:1.25rem}
.label-l{font-size:.875rem;font-weight:500;letter-spacing:.01em}
.label-m{font-size:.75rem;font-weight:500;letter-spacing:.03em}
.var{color:var(--on-surface-variant)}
.num{font-variant-numeric:tabular-nums}

/* top app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);transition:background .2s}
.appbar.scrolled{background:var(--surface-c)}
.appbar .wrap{display:flex;align-items:center;gap:.25rem;min-height:4rem}
.appbar h1{flex:1;font-size:1.375rem;font-weight:400;margin:0}
.icon-btn{width:3rem;height:3rem;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--on-surface-variant)}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.icon-btn svg{width:1.5rem;height:1.5rem}
.watch-chip{display:inline-flex;align-items:center;gap:.375rem;height:2rem;padding:0 .75rem;border-radius:.5rem;border:1px solid var(--outline-variant);background:transparent;font-size:.875rem;font-weight:500;color:var(--on-surface-variant)}
.watch-chip svg{width:1.125rem;height:1.125rem}
.watch-chip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container)}
.watch-chip .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--outline)}
.watch-chip.on .dot{background:var(--ok)}

main{padding-block:.5rem calc(6.5rem + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:1rem}
.section-h{font-size:.875rem;font-weight:500;color:var(--primary);margin:.5rem 0 0;letter-spacing:.01em}

/* cards */
.card{border-radius:.75rem;padding:1rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.card.filled{background:var(--surface-c-highest)}
.card.outlined{background:var(--surface);border:1px solid var(--outline-variant)}
.card.elevated{background:var(--surface-c-low);box-shadow:0 1px 2px rgba(0,0,0,.18),0 1px 3px 1px rgba(0,0,0,.08)}
.card.feature{background:var(--primary-container);color:var(--on-primary-container)}
.card.feature .var{color:var(--on-primary-container);opacity:.8}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* buttons */
.btn{height:2.5rem;padding:0 1.5rem;border-radius:1.25rem;border:0;font-size:.875rem;font-weight:500;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap}
.btn svg{width:1.125rem;height:1.125rem}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{background:transparent;border:1px solid var(--outline);color:var(--primary)}
.btn.text{background:transparent;color:var(--primary);padding:0 .75rem}
.btn.big{height:3.5rem;padding:0 2rem;border-radius:1rem;font-size:1rem}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.38;pointer-events:none}

/* chips & segmented */
.chip{display:inline-flex;align-items:center;gap:.375rem;height:2rem;padding:0 .75rem;border-radius:.5rem;border:1px solid var(--outline-variant);font-size:.875rem;font-weight:500;color:var(--on-surface-variant);background:transparent}
.chip.ok{background:var(--ok-container);color:var(--ok);border-color:transparent}
.chip.err{background:var(--error-container);color:var(--on-error-container);border-color:transparent}
.chip.sel{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.seg{display:flex;border:1px solid var(--outline);border-radius:1.25rem;overflow:hidden;width:100%}
.seg button{flex:1;min-width:0;height:2.5rem;border:0;border-left:1px solid var(--outline);background:transparent;font-size:.875rem;font-weight:500;color:var(--on-surface);padding:0 .5rem}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:.75rem 0;min-height:3.5rem;text-align:left;background:none;border:0;width:100%}
.li+.li{border-top:1px solid var(--outline-variant)}
.li .lead{width:3.5rem;height:3.5rem;border-radius:.75rem;display:grid;place-items:center}
.li .lead svg{width:1.75rem;height:1.75rem}
.li .txt{min-width:0;display:flex;flex-direction:column}
.li .txt b{font-weight:400;font-size:1rem}
.li .txt span{font-size:.875rem;color:var(--on-surface-variant)}
.li .trail{font-size:.75rem;font-weight:500;color:var(--on-surface-variant)}
.check{width:1.5rem;height:1.5rem;border-radius:.25rem;border:2px solid var(--on-surface-variant);display:grid;place-items:center}
.check svg{width:1.125rem;height:1.125rem;color:var(--on-primary)}
[aria-checked="true"] .check{background:var(--primary);border-color:var(--primary)}
.dots{display:flex;gap:.1875rem}
.dots i{width:.4375rem;height:.4375rem;border-radius:50%;background:var(--outline-variant)}
.dots i.on{background:var(--primary)}
.progress{height:.25rem;border-radius:.125rem;background:var(--surface-c-highest);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.stat{display:flex;flex-direction:column}
.stat b{font-size:1.75rem;font-weight:400;line-height:2.25rem}
.stat span{font-size:.75rem;color:var(--on-surface-variant)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.tile{background:var(--surface-c);border-radius:.75rem;padding:.75rem;display:flex;flex-direction:column;gap:.125rem;min-width:0}
.tile b{font-size:1.125rem;font-weight:500;color:var(--primary)}
.tile span{font-size:.75rem;color:var(--on-surface-variant)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem}
.day{border-radius:.75rem;padding:.5rem .125rem;text-align:center;background:var(--surface-c);display:flex;flex-direction:column;gap:.125rem;min-width:0}
.day b{font-size:.75rem;font-weight:500}
.day small{font-size:.625rem;line-height:1.2;color:var(--on-surface-variant);overflow-wrap:anywhere}
.day.today{background:var(--primary);color:var(--on-primary)}
.day.today small{color:var(--on-primary)}
.note{font-size:.875rem;color:var(--on-surface-variant);background:var(--surface-c);border-radius:.75rem;padding:.75rem}
.warn{background:var(--error-container);color:var(--on-error-container)}
.steps{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.5rem;font-size:.9375rem}
.field{display:flex;flex-direction:column;gap:.5rem}
.field label,.field .lbl{font-size:.875rem;font-weight:500;color:var(--on-surface-variant)}
select{font:inherit;font-size:1rem;height:3.5rem;padding:0 1rem;border-radius:.25rem;border:1px solid var(--outline);background:var(--surface);color:var(--on-surface);width:100%}
input[type=range]{width:100%;accent-color:var(--primary);height:2rem}
.switch{position:relative;width:3.25rem;height:2rem;border-radius:1rem;border:2px solid var(--outline);background:var(--surface-c-highest);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:50%;left:.375rem;width:1rem;height:1rem;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all .2s}
.switch[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.switch[aria-checked="true"]::after{left:1.5rem;width:1.5rem;height:1.5rem;background:var(--on-primary)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 0}
.setrow .txt{min-width:0}
.aa{display:flex;align-items:center;gap:.75rem}
.aa span:first-child{font-size:.875rem}.aa span:last-child{font-size:1.375rem}

/* breathe stage */
.stage{position:relative;height:20rem;border-radius:1.75rem;background:radial-gradient(circle at 50% 45%,#1F3B3A 0%,#0B1514 72%);display:grid;place-items:center;overflow:hidden;color:#E6F2F0}
.orb{width:8rem;height:8rem;border-radius:50%;background:radial-gradient(circle at 40% 35%,#CFF7F2 0%,#5FC4BC 45%,#1E6E68 100%);box-shadow:0 0 4rem .5rem rgba(95,196,188,.35);transform:scale(.6);transition-property:transform;transition-timing-function:ease-in-out}
.stage .lbl{position:absolute;bottom:1.25rem;left:0;right:0;text-align:center;font-size:1.25rem;font-weight:500}
.stage .tl{position:absolute;top:1rem;left:1.25rem;font-size:.875rem;opacity:.8}
.stage .tr{position:absolute;top:1rem;right:1.25rem;font-size:.875rem;opacity:.8}
.stage .center{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;font-weight:300;pointer-events:none}
.results{display:flex;gap:.5rem;flex-wrap:wrap}

/* navigation bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface-c);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:5rem;align-items:center}
.navbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.75rem;font-weight:500;color:var(--on-surface-variant);padding:0}
.navbar .ind{width:4rem;height:2rem;border-radius:1rem;display:grid;place-items:center;transition:background .2s}
.navbar svg{width:1.5rem;height:1.5rem}
.navbar button[aria-selected="true"]{color:var(--on-surface)}
.navbar button[aria-selected="true"] .ind{background:var(--secondary-container);color:var(--on-secondary-container)}

/* snackbar */
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6rem + env(safe-area-inset-bottom,0px));z-index:60;background:#2B3231;color:#ECF2F0;border-radius:.25rem;padding:.875rem 1rem;font-size:.875rem;max-width:calc(100% - 32px);box-shadow:0 3px 6px rgba(0,0,0,.3)}

/* player — always dark */
.player{position:fixed;inset:0;z-index:50;background:#08100F;color:#E6F2F0;display:flex;flex-direction:column}
.player canvas{position:absolute;inset:0;width:100%;height:100%}
.pl-top,.pl-bottom{position:relative;z-index:2;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.pl-top{padding-top:calc(env(safe-area-inset-top,0px) + .5rem);display:flex;align-items:center;gap:.5rem;min-height:4rem}
.pl-top .ttl{flex:1;font-size:1rem;font-weight:500}
.pl-top .icon-btn{color:#E6F2F0}
.pl-hr{display:inline-flex;align-items:center;gap:.375rem;font-size:.875rem;color:#BFE9E4}
.pl-hr svg{width:1rem;height:1rem;color:#FF8A80}
.pl-mid{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.75rem;padding:0 1.5rem}
.pl-mid .ph-n{font-size:.875rem;font-weight:500;letter-spacing:.08em;color:#80D5D0;text-transform:uppercase}
.pl-mid .ph-t{font-size:2.25rem;line-height:2.75rem;color:#FFFFFF;text-wrap:balance}
.pl-mid .cue{max-width:28ch;color:#C9DAD7;font-size:1.125rem;min-height:4.5em}
.pl-bottom{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1.25rem);display:flex;flex-direction:column;gap:1rem;background:linear-gradient(to top,rgba(8,16,15,.9),rgba(8,16,15,0))}
.pl-prog{display:flex;gap:.25rem}
.pl-prog i{flex:1;height:.25rem;border-radius:.125rem;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.pl-prog i b{position:absolute;inset:0 auto 0 0;background:#80D5D0;width:0}
.pl-time{display:flex;justify-content:space-between;font-size:.875rem;color:#B5C8C5;font-variant-numeric:tabular-nums}
.pl-ctrl{display:flex;justify-content:center;align-items:center;gap:1.5rem}
.pl-ctrl .fab{width:6rem;height:6rem;border-radius:1.75rem;border:0;background:#80D5D0;color:#003735;display:grid;place-items:center}
.pl-ctrl .fab svg{width:2.25rem;height:2.25rem}
.pl-ctrl .icon-btn{color:#E6F2F0;width:3.5rem;height:3.5rem}
.pl-mix{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;align-items:center;font-size:.8125rem;color:#B5C8C5}
.pl-mix input{accent-color:#80D5D0}
.done{display:flex;flex-direction:column;align-items:center;gap:.75rem}
.done .big{font-size:3rem;color:#80D5D0;font-weight:300}

@media (prefers-reduced-motion: reduce){.orb{transition-duration:0s!important}.switch::after{transition:none}}
@media (min-width:36rem){.grid2{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<header class="appbar" id="appbar">
  <div class="wrap">
    <button class="icon-btn" id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
    <h1 id="bar-title">Stillpoint</h1>
    <button class="watch-chip" id="watch-chip"><span class="dot"></span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12c0-2.54-1.19-4.81-3.04-6.27L16 0H8l-.95 5.73C5.19 7.19 4 9.45 4 12s1.19 4.81 3.05 6.27L8 24h8l.96-5.73A7.98 7.98 0 0 0 20 12M6 12c0-3.31 2.69-6 6-6s6 2.69 6 6-2.69 6-6 6-6-2.69-6-6"/></svg><span id="watch-txt">Watch</span></button>

  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-meditate" hidden></section>
  <section class="view" id="v-breathe" hidden></section>
  <section class="view" id="v-body" hidden></section>
  <section class="view" id="v-settings" hidden></section>
</main>

function noise(kind){const len=ac.sampleRate*4,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let l=0,b0=0,b1=0,b2=0;
 for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else{b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.11}}
 const s=ac.createBufferSource();s.buffer=b;s.loop=true;return s}
function startAmbient(){stopAmbient(true);if(!ac||settings.amb==='off')return;
 ambBus=ac.createGain();ambBus.gain.value=0;ambBus.connect(master);
 if(settings.amb==='drone'){const n=noise('brown'),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;const ng=ac.createGain();ng.gain.value=.55;n.connect(lp).connect(ng).connect(ambBus);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.06;lg.gain.value=140;lfo.connect(lg).connect(lp.frequency);
  const o1=ac.createOscillator(),g1=ac.createGain();o1.frequency.value=110;g1.gain.value=.045;o1.connect(g1).connect(ambBus);
  const o2=ac.createOscillator(),g2=ac.createGain();o2.frequency.value=164.8;g2.gain.value=.025;o2.connect(g2).connect(ambBus);

 again:{en:'Next round. Breathe in deeply...',zh:'下一輪。深深吸氣……'},
 end:{en:'That was the last round. Breathe normally and stay still for a minute. Notice the energy in your body.',zh:'這是最後一輪。正常呼吸，靜靜停留一分鐘。感受身體裡的能量。'}};
function startWim(){ensureAudio();holdWake();watchUp();W={round:1,stage:'intro',n:0,holds:[],hrs:[],timer:null,t0:0,tick:null};
 $('#wh-go').textContent=t('stop');renderWimRun();speak(L(WH.intro));W.timer=setTimeout(powerPhase,9000)}
function renderWimRun(){const v=$('#v-breathe');v.querySelectorAll('#wh-b,#wh-r,#wh-p').forEach(n=>n.closest('.field').remove());const r=$('#whr');if(r)r.textContent=`${t('round')} ${W.round}${lang==='zh'?' 輪':''} / ${settings.whRounds}`}
function powerPhase(){if(!W)return;W.stage='power';W.n=0;renderWimRun();cue(`${t('round')} ${W.round}`,t('wimName'));breathe()}
function breathe(){if(!W||W.stage!=='power')return;const [inS,outS]=PACE[settings.whPace];const orb=$('#orb'),c=$('#whc'),lab=$('#orbl');
 W.n++;if(c)c.textContent=W.n;if(lab)lab.textContent=t('inhale');
 if(orb){orb.style.transitionDuration=inS+'s';orb.style.transform='scale(1.5)'}
 if(W.n<=3)speak(L(WH.fully));else tone(true,inS);
 W.timer=setTimeout(()=>{if(!W)return;if(orb){orb.style.transitionDuration=outS+'s';orb.style.transform='scale(.7)'}if(lab)lab.textContent=t('exhale');
  if(W.n>=settings.whBreaths){W.timer=setTimeout(holdPhase,outS*1000)}else{W.timer=setTimeout(breathe,outS*1000)}},inS*1000)}
function holdPhase(){if(!W)return;W.stage='hold';W.t0=Date.now();speak(L(WH.last));cue(t('retention'),lang==='zh'?'點螢幕結束閉氣':'Tap the screen when you need to breathe');
 const orb=$('#orb');if(orb){orb.style.transitionDuration='4s';orb.style.transform='scale(.45)'}
 $('#orbl').textContent=t('needBreath')+' ↑';
 W.tick=setInterval(()=>{const s=(Date.now()-W.t0)/1000;const c=$('#whc');if(c)c.textContent=fmt(s);const h=$('#whhr');if(h)h.textContent=hr.bpm?hr.bpm+' '+t('bpm'):'';if(s>=240)endHold()},250)}
function endHold(){if(!W||W.stage!=='hold')return;clearInterval(W.tick);const s=Math.round((Date.now()-W.t0)/1000);W.holds.push(s);
 W.stage='recover';speak(L(WH.recover));cue(t('recovery'),'15 s');const orb=$('#orb');if(orb){orb.style.transitionDuration='2s';orb.style.transform='scale(1.5)'}
 $('#orbl').textContent=t('recovery');let left=15;const c=$('#whc');if(c)c.textContent=left;
 W.tick=setInterval(()=>{left--;const c2=$('#whc');if(c2)c2.textContent=Math.max(0,left);if(left<=0){clearInterval(W.tick);afterRecovery()}},1000);
 const res=$('#wh-res');if(res)res.innerHTML=W.holds.map((x,i)=>`<span class="chip sel">${t('round')} ${i+1}${lang==='zh'?' 輪':''} · ${fmt(x)}</span>`).join('')}
function afterRecovery(){if(!W)return;speak(L(WH.release));bell(1);const orb=$('#orb');if(orb){orb.style.transitionDuration='3s';orb.style.transform='scale(.6)'}
 if(W.round>=settings.whRounds){W.timer=setTimeout(finishWim,3500);return}
 W.round++;W.timer=setTimeout(()=>{speak(L(WH.again));W.timer=setTimeout(powerPhase,4000)},3500)}
function finishWim(){if(!W)return;speak(L(WH.end));bell(2,330);store.set('whLast',W.holds);
 const min=Math.max(1,Math.round(W.holds.reduce((a,b)=>a+b,0)/60+settings.whRounds*(settings.whBreaths*3/60+.4)));addLog('wim',min,{holds:W.holds,hr:avg(W.hrs)});cue(t('complete'),W.holds.map(fmt).join(' · '));
 const holds=W.holds;stopWim(false);renderBreathe();const l=$('#orbl');if(l)l.textContent=t('complete');const c=$('#whc');if(c)c.textContent=fmt(Math.max(...holds))}
function stopWim(rerender){if(!W)return;clearTimeout(W.timer);clearInterval(W.tick);hush();W=null;dropWake();if(rerender&&cur==='breathe')renderBreathe()}

/* ---------- body ---------- */
function renderBody(){const v=$('#v-body'),tk=getTicks()[todayKey()]||[],di=dayIdx();
 const daysAgo=Math.floor((new Date(todayKey())-new Date(GARMIN.latest))/864e5);
 const dn=lang==='zh'?['一','二','三','四','五','六','日']:['M','T','W','T','F','S','S'];
 v.innerHTML=`
  <div class="card filled">
    <div class="row between"><h3 class="title-m">${t('garmin')}</h3><span class="chip err">${t('lastSync')} ${daysAgo} ${t('daysAgo')}</span></div>
    <p class="body-m">${t('syncWarn')}</p>
  </div>
  <h2 class="section-h">${t('recent')}</h2>
  <div class="card outlined" style="padding-block:.25rem"><div class="list">${GARMIN.acts.map(a=>`<div class="li" style="grid-template-columns:1fr auto"><span class="txt"><b>${esc(L(a.type))}</b><span class="num">${a.d.slice(5)} · ${a.tm} · HR ${a.hr}${a.kcal?' · '+a.kcal+' kcal':''}</span></span><span class="trail num">${fmt(a.dur)}</span></div>`).join('')}</div></div>
  <p class="label-m var">${t('sourceG')}</p>
  <h2 class="section-h">${t('targets')}</h2>
  <div class="grid2">${TARGETS.map(x=>`<div class="tile"><span>${esc(L(x.k))}</span><b class="num">${x.v}</b><span>${esc(L(x.s))}</span></div>`).join('')}</div>
  <h2 class="section-h">${t('weekT')}</h2>
  <div class="week">${WEEK.map((w,i)=>`<div class="day ${i===di?'today':''}"><b>${dn[i]}</b><small>${esc(L(w))}</small></div>`).join('')}</div>
  <div class="row between"><h2 class="section-h">${t('supT')}</h2><span class="body-m var num">${tk.length}/${SUPS.length}</span></div>
  <div class="card outlined" style="padding-block:.25rem">
    ${GROUPS.map(g=>`<p class="label-m" style="color:var(--primary);margin:.75rem 0 0">${esc(T[lang].timings[g])}</p><div class="list">${SUPS.filter(x=>x.g===g).map(x=>{const on=tk.includes(x.id);return `<button class="li" role="checkbox" aria-checked="${on}" data-id="${x.id}"><span class="check">${on?ICON.check:''}</span><span class="txt"><b>${esc(x.n)}</b><span>${esc(L(x.dose))}</span></span><span class="dots">${last7(x.id).map(d=>`<i class="${d?'on':''}"></i>`).join('')}</span></button>`}).join('')}</div>`).join('')}
  </div>
  <p class="note">${t('supNote')}</p>`;
 v.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>toggleSup(b.dataset.id))}

/* ---------- settings ---------- */
function renderSettings(){const v=$('#v-settings');const list=langVoices(),curV=pickVoice();
 const sizes=[[.875,'A−'],[1,'A'],[1.15,'A+'],[1.3,'A++'],[1.5,'A+++']];
 v.innerHTML=`
  <h2 class="section-h">${t('textSize')}</h2>
  <div class="card filled"><div class="seg" id="seg-size">${sizes.map(([s,l])=>`<button aria-pressed="${settings.scale===s}" data-v="${s}" style="font-size:${.75*s}rem">${l}</button>`).join('')}</div>
   <p class="body-m var">${lang==='zh'?'這是預覽文字。':'This is how text will look.'}</p></div>
  <h2 class="section-h">${t('language')}</h2>
  <div class="card filled"><div class="seg" id="seg-lang"><button aria-pressed="${lang==='en'}" data-v="en">English</button><button aria-pressed="${lang==='zh'}" data-v="zh">中文</button></div></div>
  <h2 class="section-h">${t('watch')}</h2>
  <div class="card filled">
    <div class="row between"><h3 class="title-m">${t('watchCard')}</h3><span class="chip ${hr.state==='on'?'ok':''}" id="hr-state">${hr.state==='on'?`${t('watchOn')} · ${hr.bpm||'--'} ${t('bpm')}`:t('watchOff')}</span></div>
    <ol class="steps">${T[lang].watchHow.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    ${hasBT?'':`<p class="note warn">${t('btNo')}</p>`}
    <div><button class="btn filled" id="bt-go" ${hasBT?'':'disabled'}>${hr.dev?t('watchReconnect'):t('watchConnect')}</button></div>
    <div class="setrow"><div class="txt"><p class="title-m">${t('watchCuesT')}</p><p class="body-m var">${t('watchCuesD')}</p></div><button class="switch" role="switch" id="sw-cues" aria-checked="${settings.watchCues}" aria-label="${t('watchCuesT')}"></button></div>
  </div>
  <h2 class="section-h">${t('voiceSet')}</h2>
  <div class="card filled">
    ${hasTTS?`<div class="field"><label for="voice-sel">${lang==='zh'?'中文聲音':'English voice'}</label><select id="voice-sel">${list.length?list.map(x=>`<option value="${esc(x.voiceURI)}" ${curV&&x.voiceURI===curV.voiceURI?'selected':''}>${esc(x.name)} · ${x.localService?t('offline'):t('online')}</option>`).join(''):`<option>${lang==='zh'?'系統預設':'System default'}</option>`}</select></div>
    <div><button class="btn tonal" id="voice-test">${ICON.play}${t('preview')}</button></div>`:''}
    <p class="body-m var">${t('voiceTip')}</p>
  </div>
  <h2 class="section-h">${t('ambSound')}</h2>
  <div class="card filled"><div class="seg" id="seg-amb">${['drone','rain','off'].map(a=>`<button aria-pressed="${settings.amb===a}" data-v="${a}">${t(a)}</button>`).join('')}</div></div>`;
 v.querySelectorAll('#seg-size button').forEach(b=>b.onclick=()=>{settings.scale=+b.dataset.v;saveSettings();applyScale();renderSettings()});
 v.querySelectorAll('#seg-lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.v));
 v.querySelectorAll('#seg-amb button').forEach(b=>b.onclick=()=>{settings.amb=b.dataset.v;saveSettings();renderSettings()});
 $('#bt-go').onclick=connectWatch;
 $('#sw-cues').onclick=async()=>{settings.watchCues=!settings.watchCues;saveSettings();if(settings.watchCues)await ensureCues();renderSettings()};
 const vs=$('#voice-sel');if(vs)vs.onchange=()=>store.set('voice_'+lang,vs.value);
 const vt=$('#voice-test');if(vt)vt.onclick=()=>{hush();speak(lang==='zh'?'閉上眼睛。慢慢吸一口氣……再慢慢吐出來。':'Close your eyes. Take a slow breath in... and let it go.')}}

/* ---------- player ---------- */
let P=null,tickT=null,raf=null;
const SIT={open:{en:'Welcome. Sit comfortably, close your eyes, and let your breath settle. I will ring a bell to close.',zh:'歡迎。舒服地坐著，閉上眼睛，讓呼吸安定下來。結束時我會敲鐘。'},
 mid:{en:'If you have drifted, gently come back to the breath.',zh:'如果思緒飄走了，溫和地回到呼吸。'},
 close:{en:'Slowly deepen your breath. Move your fingers. Open your eyes when you are ready.',zh:'慢慢加深呼吸，動一動手指。準備好了就睜開眼睛。'}};
function buildSilent(){const tot=settings.silentMin*60,n=settings.interval?Math.max(1,Math.round(settings.silentMin/settings.interval)):1,d=tot/n;
 return{id:'silent',name:{en:'Guided sitting',zh:'引導靜坐'},phases:Array.from({length:n},(_,i)=>({d,c:i%2?[70,130,125]:[50,105,100],t:{en:n>1?`Sitting · ${i+1}`:'Sitting',zh:n>1?`靜坐 · ${i+1}`:'靜坐'},
  cues:[...(i===0?[C(0,SIT.open.en,SIT.open.zh)]:[C(0,SIT.mid.en,SIT.mid.zh)]),...(i===n-1?[C(Math.max(10,d-25),SIT.close.en,SIT.close.zh)]:[])]}))}}
function openSession(id){const s=id==='silent'?buildSilent():SESSIONS.find(x=>x.id===id);
 P={s,idx:0,pe:0,te:0,running:false,started:false,fired:new Set(),total:s.phases.reduce((a,p)=>a+p.d,0),col:s.phases[0].c.slice(),done:false,hrs:[],hrStart:null};
 $('#player').hidden=false;document.body.style.overflow='hidden';$('#pl-name').textContent=L(s.name);
 $('#pl-prog').innerHTML=s.phases.map(p=>`<i style="flex:${p.d}"><b></b></i>`).join('');
 $('#vol-voice').value=settings.voiceVol;$('#vol-amb').value=settings.ambVol;
 $('#pl-mid').innerHTML='<div class="ph-n" id="pl-phn"></div><div class="ph-t" id="pl-pht"></div><div class="cue" id="pl-cue" aria-live="polite"></div>';
 $('#pl-icon').innerHTML=ICON.play.replace(/<\/?svg[^>]*>/g,'');paintWatch();updatePlayer();sizeCanvas();loop()}
function enterPhase(first){const p=P.s.phases[P.idx];P.pe=0;P.fired=new Set();if(!first)bell(1);
 cue(L(p.t),`${t('phase')} ${P.idx+1} ${t('of')} ${P.s.phases.length} · ${fmt(p.d)}`);$('#pl-cue').textContent=''}
function playPause(){if(!P)return;if(P.done){closePlayer();return}
 ensureAudio();
 if(!P.running){P.running=true;P.last=performance.now();holdWake();
  if(!P.started){P.started=true;watchUp();P.hrStart=hr.bpm;startAmbient();if(hasTTS)try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){};bell(1,330);enterPhase(true)}else fadeAmbient(true);
  tickT=setInterval(tick,250)}
 else{P.running=false;clearInterval(tickT);hush();fadeAmbient(false);dropWake()}
 updatePlayer()}
function tick(){if(!P||!P.running)return;const now=performance.now(),dt=Math.min(5,(now-P.last)/1000);P.last=now;P.pe+=dt;P.te+=dt;
 const p=P.s.phases[P.idx];p.cues.forEach((c,i)=>{if(!P.fired.has(i)&&P.pe>=c.t){P.fired.add(i);speak(c[lang]);$('#pl-cue').textContent=c[lang].replace(/\.\.\./g,'…')}});
 if(P.pe>=p.d){if(P.idx<P.s.phases.length-1){P.idx++;enterPhase(false)}else{finish();return}}
 updatePlayer()}
function jump(dir){if(!P||P.done)return;const ni=P.idx+dir;if(ni<0||ni>=P.s.phases.length){if(dir<0){P.te-=P.pe;P.pe=0;P.fired=new Set()}updatePlayer();return}
 hush();P.te=P.s.phases.slice(0,ni).reduce((a,x)=>a+x.d,0);P.idx=ni;if(P.started)enterPhase(false);else P.pe=0;updatePlayer()}
function finish(){clearInterval(tickT);P.running=false;P.done=true;bell(3,330);fadeAmbient(false);setTimeout(()=>stopAmbient(),6000);dropWake();
 const min=Math.max(1,Math.round(P.te/60));const h0=P.hrStart||P.hrs.slice(0,20).length&&avg(P.hrs.slice(0,20)),h1=P.hrs.length?avg(P.hrs.slice(-20)):null;
 addLog(P.s.id,min,h0&&h1?{hr0:h0,hr1:h1}:null);cue(t('complete'),`${min} ${t('minutes')}`);
 $('#pl-mid').innerHTML=`<div class="done"><div class="ph-n">${esc(L(P.s.name))}</div><div class="ph-t">${t('complete')}</div><div class="big num">${min} ${t('minutes')}</div>${h0&&h1?`<div class="cue">${t('hrChange')} ${h0} → ${h1} ${t('bpm')}</div>`:''}<div class="cue">${t('logged')}</div></div>`;
 $('#pl-prog').querySelectorAll('b').forEach(b=>b.style.width='100%');$('#pl-rem').textContent='0:00';
 $('#pl-icon').innerHTML='<path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>'}
function updatePlayer(){if(!P||P.done)return;const p=P.s.phases[P.idx];const intro=P.s.phases[0].intro?1:0;
 $('#pl-phn').textContent=P.s.id==='silent'?fmt(p.d-P.pe):p.intro?(lang==='zh'?'開場':'Opening'):`${t('phase')} ${P.idx+1-intro} ${t('of')} ${P.s.phases.length-intro}`;
 $('#pl-pht').textContent=L(p.t);
 if(!P.started)$('#pl-cue').textContent=lang==='zh'?'戴上耳機，按下播放。':'Put on headphones and press play.';
 $('#pl-prog').querySelectorAll('b').forEach((b,i)=>b.style.width=(i<P.idx?100:i===P.idx?Math.min(100,P.pe/p.d*100):0)+'%');
 $('#pl-el').textContent=fmt(P.te);$('#pl-rem').textContent='-'+fmt(P.total-P.te);
 $('#pl-icon').innerHTML=(P.running?ICON.pause:ICON.play).replace(/<\/?svg[^>]*>/g,'');$('#pl-play').setAttribute('aria-label',P.running?'Pause':'Play')}
function closePlayer(){clearInterval(tickT);hush();stopAmbient();dropWake();cancelAnimationFrame(raf);
 if(P&&!P.done&&P.te>=120)addLog(P.s.id,Math.round(P.te/60));P=null;$('#player').hidden=true;document.body.style.overflow='';render()}
$('#pl-play').onclick=playPause;$('#pl-close').onclick=closePlayer;$('#pl-next').onclick=()=>jump(1);$('#pl-back').onclick=()=>jump(-1);
$('#vol-voice').oninput=e=>{settings.voiceVol=+e.target.value;saveSettings()};
$('#vol-amb').oninput=e=>{settings.ambVol=+e.target.value;saveSettings();setAmbVol()};

/* ---------- visuals ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let lastDraw=0;
function sizeCanvas(){const r=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',()=>{if(P)sizeCanvas()});
function loop(ts=0){if(!P)return;raf=requestAnimationFrame(loop);if(reduce&&ts-lastDraw<1000)return;lastDraw=ts;
 const w=innerWidth,h=innerHeight,target=P.s.phases[Math.min(P.idx,P.s.phases.length-1)].c;
 for(let i=0;i<3;i++)P.col[i]+=(target[i]-P.col[i])*.01;const c=P.col.map(Math.round);
 cx.globalCompositeOperation='source-over';cx.fillStyle='#08100F';cx.fillRect(0,0,w,h);cx.globalCompositeOperation='lighter';const m=Math.min(w,h);
 for(let k=0;k<4;k++){const x=w/2+Math.cos(ts*7e-5*(k+1)+k*1.7)*w*.22,y=h*.42+Math.sin(ts*5e-5*(k+2)+k*2.1)*h*.14,r=m*(.42+.1*Math.sin(ts*3e-4+k));
  const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${k%2?.16:.22})`);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,w,h)}
 const br=.5-.5*Math.cos(ts/10000*2*Math.PI),rr=m*(.09+.05*br),gx=w/2,gy=h*.42;
 const g2=cx.createRadialGradient(gx,gy,0,gx,gy,rr*2.6);g2.addColorStop(0,'rgba(225,245,240,.5)');g2.addColorStop(.35,`rgba(${c},.28)`);g2.addColorStop(1,'rgba(0,0,0,0)');
 cx.fillStyle=g2;cx.beginPath();cx.arc(gx,gy,rr*2.6,0,Math.PI*2);cx.fill()}

function setLang(l){lang=l;store.set('lang',l);hush();if(P&&!P.done){$('#pl-name').textContent=L(P.s.name);updatePlayer()}render()}

render();autoConnect();
})();
</script>
