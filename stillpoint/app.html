<title>RL Studio Stillpoint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app shell — sticky brand header, one scrolling view, fixed bottom tab bar; full-screen dark player overlay */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1B2633; --muted:#5C6A7B; --line:#DCE3EB;
  --slate:#3B5A7D; --slate-soft:#E7EEF6; --btn:#3B5A7D; --btn-ink:#FFFFFF;
  --gold:#D4A051; --gold-ink:#8A6320; --gold-soft:#FBF3E6;
  --ok:#2F7A47; --ok-soft:#E4F2E8; --warn:#A0620C; --warn-soft:#FCEFD9;
  --f-display:'Merriweather',Georgia,'Noto Sans TC',serif;
  --f-body:'Poppins','Noto Sans TC',system-ui,sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151E; --surface:#162130; --ink:#E6ECF2; --muted:#93A2B4; --line:#283648;
  --slate:#8DB0D6; --slate-soft:#1C2A3B; --btn:#3B5A7D; --btn-ink:#FFFFFF;
  --gold:#D4A051; --gold-ink:#E3B872; --gold-soft:#2A2418;
  --ok:#6CC08A; --ok-soft:#173226; --warn:#E5A84E; --warn-soft:#33270F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151E; --surface:#162130; --ink:#E6ECF2; --muted:#93A2B4; --line:#283648;
  --slate:#8DB0D6; --slate-soft:#1C2A3B; --btn:#3B5A7D; --btn-ink:#FFFFFF;
  --gold:#D4A051; --gold-ink:#E3B872; --gold-soft:#2A2418;
  --ok:#6CC08A; --ok-soft:#173226; --warn:#E5A84E; --warn-soft:#33270F; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);color:var(--slate);text-wrap:balance;margin:0;font-weight:700}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--btn)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-size:.62rem;letter-spacing:.2em;font-weight:700;color:var(--slate);text-transform:uppercase}
.appname{font-family:var(--f-display);font-size:1.15rem;color:var(--slate);line-height:1.1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font-size:.8rem;font-weight:500}
.lang button[aria-pressed="true"]{background:var(--gold);color:#1B2633}

main{padding-block:18px 110px}
.view{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hero{background:linear-gradient(160deg,#22364D 0%,#3B5A7D 70%,#55708F 100%);border:0;color:#F3F6FA}
.card.hero h2{color:#FFFFFF;font-size:1.4rem}
.card.hero .eyebrow{color:#E9C98F}
.card.hero p{color:#D8E2EE}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.btn{border:0;border-radius:999px;padding:11px 20px;background:var(--btn);color:var(--btn-ink);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--gold);color:#1B2633}
.btn.gold{background:var(--gold);color:#1B2633}
.btn.ghost{background:transparent;color:var(--slate);border:1px solid var(--line)}
.btn.small{padding:7px 14px;font-size:.85rem}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--slate-soft);color:var(--slate)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}

/* session list */
.sessions{display:grid;gap:12px}
.sess{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink)}
.sess:hover{border-color:var(--gold)}
.sess .disc{width:56px;height:56px;border-radius:50%}
.sess .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.sess .meta b{font-family:var(--f-display);color:var(--slate);font-size:1rem}
.sess .meta span{font-size:.82rem;color:var(--muted)}
.sess .len{font-family:var(--f-data);font-size:.85rem;color:var(--gold-ink)}
.phases{display:flex;gap:3px;margin-top:6px}
.phases i{display:block;height:4px;border-radius:2px;background:var(--line)}

.field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
.field select,.field input[type=range]{width:100%}
select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1B2633}

/* breathe */
.orbstage{position:relative;height:300px;display:grid;place-items:center;border-radius:var(--r);background:radial-gradient(circle at 50% 45%,#2B4563 0%,#14202E 70%);overflow:hidden}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F2D7A6 0%,#D4A051 45%,#8C6A3A 100%);box-shadow:0 0 60px 10px rgba(212,160,81,.35);transform:scale(.7);transition-property:transform;transition-timing-function:ease-in-out}
.orblabel{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#F3F6FA;font-weight:500;letter-spacing:.04em}
.orbcount{position:absolute;top:18px;right:20px;color:#C9D6E5;font-family:var(--f-data);font-size:.85rem}

/* body tab */
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act b{font-weight:500}
.act .r{text-align:right;font-family:var(--f-data);font-size:.82rem;color:var(--muted)}
.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tgt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tgt .v{font-family:var(--f-data);font-size:1.05rem;color:var(--slate)}
.tgt .s{font-size:.75rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border-radius:10px;padding:8px 4px;text-align:center;background:var(--slate-soft);display:flex;flex-direction:column;gap:2px;min-width:0}
.day.today{background:var(--gold);color:#1B2633}
.day.today small{color:#1B2633}
.day b{font-size:.72rem;letter-spacing:.06em}
.day small{font-size:.66rem;line-height:1.25;color:var(--muted)}
.supgroup{display:flex;flex-direction:column;gap:2px}
.supgroup h3{font-family:var(--f-body);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin:8px 0 2px}
.sup{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);width:100%}
.sup .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:#fff}
.sup[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.sup .nm{display:flex;flex-direction:column;min-width:0}
.sup .nm small{color:var(--muted);font-size:.75rem}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--slate-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .4s}
.note{font-size:.8rem;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.status{font-size:.82rem}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;color:var(--muted);padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:500;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--slate);border-top-color:var(--gold)}

/* player overlay — deliberately always dark */
.player{position:fixed;inset:0;z-index:50;background:#0A1018;color:#EEF2F7;display:flex;flex-direction:column}
.player canvas{position:absolute;inset:0;width:100%;height:100%}
.pl-top,.pl-bottom{position:relative;z-index:2;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.pl-top{padding-top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl-top .x{border:1px solid rgba(255,255,255,.25);background:rgba(10,16,24,.35);color:#EEF2F7;border-radius:999px;padding:7px 14px;font-size:.85rem}
.pl-mid{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:0 24px}
.pl-mid .ph-n{font-family:var(--f-data);font-size:.78rem;letter-spacing:.2em;color:#E9C98F;text-transform:uppercase}
.pl-mid .ph-t{font-family:var(--f-display);font-size:2rem;line-height:1.2;color:#FFFFFF;text-wrap:balance}
.pl-mid .cue{max-width:30ch;color:#D3DDE9;font-size:1rem;min-height:3.2em;font-style:italic;font-family:var(--f-display)}
.pl-bottom{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:14px;background:linear-gradient(to top,rgba(10,16,24,.85),rgba(10,16,24,0))}
.pl-prog{display:flex;gap:4px}
.pl-prog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.pl-prog i b{position:absolute;inset:0 auto 0 0;background:#D4A051;width:0}
.pl-time{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:.85rem;color:#C2CEDC}
.pl-ctrl{display:flex;justify-content:center;align-items:center;gap:18px}
.pl-ctrl .play{width:72px;height:72px;border-radius:50%;border:0;background:#D4A051;color:#1B2633;display:grid;place-items:center}
.pl-ctrl .play svg{width:30px;height:30px}
.pl-ctrl .sm{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,16,24,.35);color:#EEF2F7;display:grid;place-items:center}
.pl-ctrl .sm svg{width:20px;height:20px}
.pl-mix{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:.78rem;color:#C2CEDC}
.pl-mix input{width:100%;accent-color:#D4A051}
.done{display:flex;flex-direction:column;align-items:center;gap:12px}
.done .big{font-family:var(--f-data);font-size:2.4rem;color:#E9C98F}

@media (prefers-reduced-motion: reduce){ .orb{transition-duration:0s !important} .bar i{transition:none} }
@media (min-width:560px){ .targets{grid-template-columns:repeat(4,minmax(0,1fr))} }
</style>

<header class="hdr">
  <div class="wrap">
    <div>
      <div class="brand">RL Studio</div>
      <div class="appname" id="appname">Stillpoint</div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-meditate" hidden></section>
  <section class="view" id="v-breathe" hidden></section>
  <section class="view" id="v-body" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i="tabToday">Today</span></button>
    <button role="tab" data-tab="meditate" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v5M7 21c0-3 2-5 5-5s5 2 5 5M4 14c2.5-.5 5-1 8-1s5.5.5 8 1"/></svg><span data-i="tabMed">Meditate</span></button>
    <button role="tab" data-tab="breathe" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg><span data-i="tabBreathe">Breathe</span></button>
    <button role="tab" data-tab="body" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span data-i="tabBody">Body</span></button>
  </div>
</nav>

<div class="player" id="player" hidden>
  <canvas id="cv"></canvas>
  <div class="pl-top">
    <span class="eyebrow" style="color:#C2CEDC" id="pl-name"></span>
    <button class="x" id="pl-close"></button>
  </div>
  <div class="pl-mid" id="pl-mid">
    <div class="ph-n" id="pl-phn"></div>
    <div class="ph-t" id="pl-pht"></div>
    <div class="cue" id="pl-cue" aria-live="polite"></div>
  </div>
  <div class="pl-bottom">
    <div class="pl-prog" id="pl-prog"></div>
    <div class="pl-time"><span id="pl-el">0:00</span><span id="pl-rem">0:00</span></div>
    <div class="pl-ctrl">
      <button class="sm" id="pl-back" aria-label="Previous phase"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
      <button class="play" id="pl-play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" id="pl-icon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="sm" id="pl-next" aria-label="Next phase"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button>
    </div>
    <div class="pl-mix">
      <label for="vol-voice" data-i="voice">Voice</label><input type="range" id="vol-voice" min="0" max="1" step="0.05" value="0.9">
      <label for="vol-amb" data-i="ambient">Ambient</label><input type="range" id="vol-amb" min="0" max="1" step="0.05" value="0.5">
    </div>
  </div>
</div>

/* ---------- audio ---------- */
let ac=null,master=null,ambBus=null,ambNodes=[];
let settings=Object.assign({amb:'drone',interval:5,silentMin:15,voiceVol:.9,ambVol:.5},store.get('settings',{}));
const saveSettings=()=>store.set('settings',settings);
function ensureAudio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.9;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume()}catch(e){}}
function noise(kind){const len=ac.sampleRate*4,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);let l=0,b0=0,b1=0,b2=0;
 for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else{b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.11}}
 const s=ac.createBufferSource();s.buffer=b;s.loop=true;return s}
function startAmbient(){stopAmbient(true);if(!ac||settings.amb==='off')return;
 ambBus=ac.createGain();ambBus.gain.value=0;ambBus.connect(master);
 if(settings.amb==='drone'){const n=noise('brown'),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;const ng=ac.createGain();ng.gain.value=.55;n.connect(lp).connect(ng).connect(ambBus);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.06;lg.gain.value=140;lfo.connect(lg).connect(lp.frequency);
  const o1=ac.createOscillator(),g1=ac.createGain();o1.frequency.value=110;g1.gain.value=.045;o1.connect(g1).connect(ambBus);
  const o2=ac.createOscillator(),g2=ac.createGain();o2.frequency.value=164.8;g2.gain.value=.025;o2.connect(g2).connect(ambBus);
  [n,lfo,o1,o2].forEach(x=>x.start());ambNodes=[n,lfo,o1,o2]}
 else{const n=noise('pink'),hp=ac.createBiquadFilter(),lp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=400;lp.type='lowpass';lp.frequency.value=5200;const g=ac.createGain();g.gain.value=.5;n.connect(hp).connect(lp).connect(g).connect(ambBus);n.start();ambNodes=[n]}
 ambBus.gain.linearRampToValueAtTime(settings.ambVol*.6,ac.currentTime+3)}
function setAmbVol(){if(ambBus&&ac)ambBus.gain.setTargetAtTime(settings.ambVol*.6,ac.currentTime,.3)}
function fadeAmbient(on){if(!ambBus||!ac)return;ambBus.gain.cancelScheduledValues(ac.currentTime);ambBus.gain.setTargetAtTime(on?settings.ambVol*.6:0,ac.currentTime,.6)}
function stopAmbient(now){const nodes=ambNodes,bus=ambBus;ambNodes=[];ambBus=null;if(!bus)return;try{bus.gain.setTargetAtTime(0,ac.currentTime,now?.05:.5);setTimeout(()=>{nodes.forEach(n=>{try{n.stop()}catch(e){}});bus.disconnect()},now?200:2500)}catch(e){}}
function bell(count=1,base=392){if(!ac)return;for(let k=0;k<count;k++){const t0=ac.currentTime+.05+k*2.4;[[1,.22],[2.76,.08],[5.4,.035]].forEach(([m,a],i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=base*m;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(a,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+7-i*1.8);o.connect(g).connect(master);o.start(t0);o.stop(t0+7.2)})}}
function tone(up){if(!ac)return;const t0=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(up?330:392,t0);o.frequency.linearRampToValueAtTime(up?392:330,t0+.6);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.06,t0+.08);g.gain.exponentialRampToValueAtTime(.0001,t0+1.2);o.connect(g).connect(master);o.start(t0);o.stop(t0+1.3)}

const hasTTS='speechSynthesis' in window;
let voices=[];
function loadVoices(){if(!hasTTS)return;voices=speechSynthesis.getVoices();if(cur==='meditate')renderMeditate();if(cur==='today'&&typeof offlineCheck==='function')offlineCheck()}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const langVoices=()=>voices.filter(v=>lang==='zh'?/^(zh|cmn)/i.test(v.lang):/^en/i.test(v.lang));
function pickVoice(){const saved=store.get('voice_'+lang,null),list=langVoices();
 const loc=list.filter(v=>v.localService);const pool=loc.length?loc:list;
 return list.find(v=>v.voiceURI===saved)||(lang==='zh'?(pool.find(v=>/TW|Hant/i.test(v.lang))||pool[0]):(pool.find(v=>/male/i.test(v.name)&&!/female/i.test(v.name))||pool.find(v=>/en[-_]US/i.test(v.lang))||pool[0]))||null}
function speak(text){if(!hasTTS||settings.voiceVol<=0)return;try{const u=new SpeechSynthesisUtterance(text);u.lang=lang==='zh'?'zh-TW':'en-US';const v=pickVoice();if(v)u.voice=v;u.rate=lang==='zh'?.86:.8;u.pitch=.86;u.volume=settings.voiceVol;speechSynthesis.speak(u)}catch(e){}}

let breathSel='coh',breathMin=5,B=null;
function renderBreathe(){
 const v=$('#v-breathe'),b=BREATHS.find(x=>x.id===breathSel);
 v.innerHTML=`
  <h2>${t('breathTitle')}</h2>
  <div class="seg" id="seg-br">${BREATHS.map(x=>`<button aria-pressed="${x.id===breathSel}" data-v="${x.id}">${esc(L(x.name))}</button>`).join('')}</div>
  <p class="muted" style="font-size:.88rem">${esc(L(b.use))} · <span class="mono">${b.steps.map(s=>s[1]).join(' · ')}</span></p>
  <div class="orbstage"><div class="orb" id="orb"></div><div class="orblabel" id="orbl">${t('ready')}</div><div class="orbcount" id="orbc"></div></div>
  <div class="row between">
    <div class="seg" id="seg-bm">${[1,3,5,10].map(m=>`<button aria-pressed="${breathMin===m}" data-v="${m}">${m}′</button>`).join('')}</div>
    <button class="btn gold" id="br-go">${B?t('stop'):t('start')}</button>
  </div>
  <div class="card">
    <h3>${t('toWatch')}</h3>
    <ol class="steps">${T[lang].watchSteps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    <p class="note">${t('watchNote')}</p>
  </div>`;
 v.querySelectorAll('#seg-br button').forEach(x=>x.onclick=()=>{stopBreath();breathSel=x.dataset.v;renderBreathe()});
 v.querySelectorAll('#seg-bm button').forEach(x=>x.onclick=()=>{breathMin=+x.dataset.v;renderBreathe()});
 $('#br-go').onclick=()=>B?stopBreath(true):startBreath()}
function startBreath(){ensureAudio();holdWake();const b=BREATHS.find(x=>x.id===breathSel);B={b,i:-1,end:Date.now()+breathMin*60000,timer:null};$('#br-go').textContent=t('stop');stepBreath()}
function stepBreath(){if(!B)return;const orb=$('#orb'),lab=$('#orbl'),cnt=$('#orbc');
 if(Date.now()>=B.end){bell(1);addLog('breath-'+B.b.id,breathMin);stopBreath(true);if(lab)lab.textContent=t('complete');return}
 B.i=(B.i+1)%B.b.steps.length;const [k,sec,sc]=B.b.steps[B.i];
 if(orb){orb.style.transitionDuration=sec+'s';orb.style.transform=`scale(${.55+sc*.95})`}
 if(lab)lab.textContent=t(k);if(cnt)cnt.textContent=fmt((B.end-Date.now())/1000);
 if(k==='inhale'||k==='exhale')tone(k==='inhale');
 try{navigator.vibrate&&navigator.vibrate(k==='inhale'?60:k==='exhale'?[30,60,30]:0)}catch(e){}
 B.timer=setTimeout(stepBreath,sec*1000)}
function stopBreath(rerender){if(!B)return;clearTimeout(B.timer);B=null;dropWake();if(rerender&&cur==='breathe'){const keep=$('#orbl')&&$('#orbl').textContent;renderBreathe();if(keep===t('complete'))$('#orbl').textContent=keep}}

/* ---------- body ---------- */
function renderBody(){
 const v=$('#v-body'),tk=getTicks()[todayKey()]||[],di=dayIdx();
 const daysAgo=Math.floor((new Date(todayKey())-new Date(GARMIN.latest))/864e5);
 const dn=lang==='zh'?['一','二','三','四','五','六','日']:['MON','TUE','WED','THU','FRI','SAT','SUN'];
 v.innerHTML=`
  <h2>${lang==='zh'?'身體與恢復':'Body and recovery'}</h2>
  <div class="card">
    <div class="row between"><h3>${t('garmin')}</h3><span class="chip warn">${t('lastSync')}: ${GARMIN.latest} · ${daysAgo} ${t('daysAgo')}</span></div>
    <p class="note">${t('syncWarn')}</p>
    <div class="eyebrow">${t('recent')}</div>
    <div class="acts">${GARMIN.acts.map(a=>`<div class="act"><b>${esc(L(a.type))}</b><span class="r">${fmt(a.dur)}</span><span class="muted mono" style="font-size:.78rem">${a.d.slice(5)} · ${a.tm}</span><span class="r">HR ${a.hr}${a.kcal?' · '+a.kcal+' kcal':''}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:.72rem">${t('sourceG')}</p>
  </div>
  <div class="card"><h3>${t('targets')}</h3>
    <div class="targets">${TARGETS.map(x=>`<div class="tgt"><span class="eyebrow">${esc(L(x.k))}</span><span class="v">${x.v}</span><span class="s">${esc(L(x.s))}</span></div>`).join('')}</div>
  </div>
  <div class="card"><h3>${t('weekT')}</h3>
    <div class="week">${WEEK.map((w,i)=>`<div class="day ${i===di?'today':''}"><b>${dn[i]}</b><small>${esc(L(w))}</small></div>`).join('')}</div>
  </div>
  <div class="card">
    <div class="row between"><h3>${t('supT')}</h3><span class="mono muted">${tk.length}/${SUPS.length} · ${t('last7')} ●</span></div>
    ${GROUPS.map(g=>`<div class="supgroup"><h3>${esc(T[lang].timings[g])}</h3>${SUPS.filter(x=>x.g===g).map(x=>{const on=tk.includes(x.id);return `<button class="sup" role="checkbox" aria-checked="${on}" data-id="${x.id}"><span class="box">${on?'✓':''}</span><span class="nm"><span>${esc(x.n)}</span><small>${esc(L(x.dose))}</small></span><span class="dots">${last7(x.id).map(d=>`<i class="${d?'on':''}"></i>`).join('')}</span></button>`}).join('')}</div>`).join('')}
    <p class="note">${t('supNote')}</p>
  </div>`;
 v.querySelectorAll('.sup').forEach(b=>b.onclick=()=>toggleSup(b.dataset.id))}

/* ---------- player ---------- */
let P=null,tickT=null,raf=null;
function buildSilent(){const n=settings.interval?Math.max(1,Math.round(settings.silentMin/settings.interval)):1,d=settings.silentMin*60/n;
 return{id:'silent',name:{en:'Silent timer',zh:'靜坐計時'},phases:Array.from({length:n},(_,i)=>({d,c:i%2?[90,130,170]:[70,105,150],t:{en:n>1?`Sit · ${i+1}`:'Sit',zh:n>1?`靜坐 · ${i+1}`:'靜坐'},cues:[]}))}}
function openSession(id){
 const s=id==='silent'?buildSilent():SESSIONS.find(x=>x.id===id);
 P={s,idx:0,pe:0,te:0,running:false,started:false,fired:new Set(),total:s.phases.reduce((a,p)=>a+p.d,0),col:s.phases[0].c.slice(),done:false};
 $('#player').hidden=false;document.body.style.overflow='hidden';
 $('#pl-name').textContent=L(s.name);$('#pl-close').textContent=t('close');
 $('#pl-prog').innerHTML=s.phases.map(p=>`<i style="flex:${p.d}"><b></b></i>`).join('');
 $('#vol-voice').value=settings.voiceVol;$('#vol-amb').value=settings.ambVol;
 restoreMid();updatePlayer();sizeCanvas();loop()}
function restoreMid(){$('#pl-mid').innerHTML='<div class="ph-n" id="pl-phn"></div><div class="ph-t" id="pl-pht"></div><div class="cue" id="pl-cue" aria-live="polite"></div>'}
function enterPhase(first){const p=P.s.phases[P.idx];P.pe=0;P.fired=new Set();if(!first)bell(1);
 notify(L(p.t),`${t('phase')} ${P.idx+1} ${t('of')} ${P.s.phases.length} · ${fmt(p.d)}`);$('#pl-cue').textContent=''}
function playPause(){if(!P)return;if(P.done){closePlayer();return}
 ensureAudio();
 if(!P.running){P.running=true;P.last=performance.now();holdWake();
  if(!P.started){P.started=true;startAmbient();if(hasTTS)try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){};bell(1,330);enterPhase(true)}else{fadeAmbient(true)}
  tickT=setInterval(tick,250)}
 else{P.running=false;clearInterval(tickT);hush();fadeAmbient(false);dropWake()}
 updatePlayer()}
function tick(){if(!P||!P.running)return;const now=performance.now(),dt=Math.min(5,(now-P.last)/1000);P.last=now;P.pe+=dt;P.te+=dt;
 const p=P.s.phases[P.idx];p.cues.forEach((c,i)=>{if(!P.fired.has(i)&&P.pe>=c.t){P.fired.add(i);speak(c[lang]);$('#pl-cue').textContent=c[lang]}});
 if(P.pe>=p.d){if(P.idx<P.s.phases.length-1){P.idx++;enterPhase(false)}else{finish();return}}
 updatePlayer()}
function jump(dir){if(!P||P.done)return;const ni=P.idx+dir;if(ni<0||ni>=P.s.phases.length){if(dir<0){P.te-=P.pe;P.pe=0;P.fired=new Set()}updatePlayer();return}
 hush();P.te=P.s.phases.slice(0,ni).reduce((a,x)=>a+x.d,0);P.idx=ni;if(P.started)enterPhase(false);else P.pe=0;updatePlayer()}
function finish(){clearInterval(tickT);P.running=false;P.done=true;bell(3,330);fadeAmbient(false);setTimeout(()=>stopAmbient(),6000);dropWake();
 const min=Math.max(1,Math.round(P.te/60));addLog(P.s.id,min);notify(t('complete'),`${min} ${t('minutes')}`);
 $('#pl-mid').innerHTML=`<div class="done"><div class="ph-n">${esc(L(P.s.name))}</div><div class="ph-t">${t('complete')}</div><div class="big">${min}′</div><div class="cue">${t('logged')}</div></div>`;
 $('#pl-prog').querySelectorAll('b').forEach(b=>b.style.width='100%');$('#pl-rem').textContent='0:00';
 $('#pl-icon').innerHTML='<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>';$('#pl-play').setAttribute('aria-label',t('again'))}
function updatePlayer(){if(!P||P.done)return;const p=P.s.phases[P.idx];
 const hasIntro=P.s.phases[0].intro?1:0;$('#pl-phn').textContent=P.s.id==='silent'?`${fmt(p.d-P.pe)}`:p.intro?(lang==='zh'?'開場':'Opening'):`${t('phase')} ${P.idx+1-hasIntro} ${t('of')} ${P.s.phases.length-hasIntro}`;
 $('#pl-pht').textContent=L(p.t);
 if(!P.started)$('#pl-cue').textContent=lang==='zh'?'戴上耳機，點擊播放。':'Put on headphones and press play.';
 $('#pl-prog').querySelectorAll('b').forEach((b,i)=>b.style.width=(i<P.idx?100:i===P.idx?Math.min(100,P.pe/p.d*100):0)+'%');
 $('#pl-el').textContent=fmt(P.te);$('#pl-rem').textContent='-'+fmt(P.total-P.te);
 $('#pl-icon').innerHTML=P.running?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';$('#pl-play').setAttribute('aria-label',P.running?'Pause':'Play')}
function closePlayer(){clearInterval(tickT);hush();stopAmbient();dropWake();cancelAnimationFrame(raf);
 if(P&&!P.done&&P.te>=120)addLog(P.s.id,Math.round(P.te/60));P=null;$('#player').hidden=true;document.body.style.overflow='';render()}
$('#pl-play').onclick=playPause;$('#pl-close').onclick=closePlayer;$('#pl-next').onclick=()=>jump(1);$('#pl-back').onclick=()=>jump(-1);
$('#vol-voice').oninput=e=>{settings.voiceVol=+e.target.value;saveSettings()};
$('#vol-amb').oninput=e=>{settings.ambVol=+e.target.value;saveSettings();setAmbVol()};

/* ---------- visual: drifting light field + breathing core (6 breaths/min) ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let lastDraw=0;
function sizeCanvas(){const r=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',()=>{if(P)sizeCanvas()});
function loop(ts=0){if(!P)return;raf=requestAnimationFrame(loop);if(reduce&&ts-lastDraw<1000)return;lastDraw=ts;
 const w=innerWidth,h=innerHeight,target=P.s.phases[Math.min(P.idx,P.s.phases.length-1)].c;
 for(let i=0;i<3;i++)P.col[i]+=(target[i]-P.col[i])*.01;const c=P.col.map(Math.round);
 cx.globalCompositeOperation='source-over';cx.fillStyle='#0A1018';cx.fillRect(0,0,w,h);cx.globalCompositeOperation='lighter';
 const m=Math.min(w,h);
 for(let k=0;k<4;k++){const x=w/2+Math.cos(ts*7e-5*(k+1)+k*1.7)*w*.22,y=h*.42+Math.sin(ts*5e-5*(k+2)+k*2.1)*h*.14,r=m*(.42+.1*Math.sin(ts*3e-4+k));
  const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${k%2?.16:.22})`);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,w,h)}
 const br=.5-.5*Math.cos(ts/10000*2*Math.PI),rr=m*(.09+.05*br),gx=w/2,gy=h*.42;
 const g2=cx.createRadialGradient(gx,gy,0,gx,gy,rr*2.6);g2.addColorStop(0,'rgba(245,225,185,.55)');g2.addColorStop(.35,`rgba(${c},.28)`);g2.addColorStop(1,'rgba(0,0,0,0)');
 cx.fillStyle=g2;cx.beginPath();cx.arc(gx,gy,rr*2.6,0,Math.PI*2);cx.fill()}

/* ---------- language ---------- */
function setLang(l){lang=l;store.set('lang',l);hush();if(P&&!P.done){$('#pl-name').textContent=L(P.s.name);$('#pl-close').textContent=t('close');updatePlayer()}render()}
$('#lang-en').onclick=()=>setLang('en');$('#lang-zh').onclick=()=>setLang('zh');

render();
})();
</script>
